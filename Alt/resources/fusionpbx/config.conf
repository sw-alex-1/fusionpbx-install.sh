
; FusionPBX configuration file
;
; NOTE ON COMMENTS: comments in this file use ';' — the standard INI
; comment character. Do NOT use '#' for comments: PHP parse_ini_file()
; does not treat '#' as a comment. A '#' line is parsed as a regular
; entry, and INI reserved characters inside it break the parser so
; that every FusionPBX page and CLI script dies with a fatal error.

;database system settings
database.0.type = pgsql
database.0.host = {database_host}
database.0.port = 5432
database.0.sslmode = prefer
database.0.name = {database_name}
database.0.username = {database_username}
database.0.password = {database_password}

;database switch settings
; On Alt Linux, FreeSWITCH uses PostgreSQL for all internal databases
; instead of SQLite, because SQLite file locking does not work correctly
; with FreeSWITCH on Alt Linux.
database.1.type = pgsql
database.1.host = {database_host}
database.1.port = 5432
database.1.name = {database_name}
database.1.username = {database_username}
database.1.password = {database_password}

;general settings
document.root = /var/www/fusionpbx
project.path =
temp.dir = /tmp
php.dir = /usr/bin
php.bin = php

;security settings
; FusionPBX 5.6: used for the Content-Security-Policy frame-ancestors
; header. Empty means same-origin only. Space-separated list of
; allowed origins.
security.header.content_security_policy.frame_ancestors =

;session settings
session.cookie_httponly = true
session.cookie_secure = true
session.cookie_samesite = Lax

;cache settings
cache.method = file
cache.location = /var/cache/fusionpbx
cache.settings = true

;switch settings
switch.conf.dir = /etc/freeswitch
switch.sounds.dir = /usr/share/freeswitch/sounds
switch.database.dir = /var/lib/freeswitch/db
switch.recordings.dir = /var/lib/freeswitch/recordings
switch.storage.dir = /var/lib/freeswitch/storage
switch.voicemail.dir = /var/lib/freeswitch/storage/voicemail
switch.scripts.dir = /usr/share/freeswitch/scripts
switch.log.dir = /var/log/freeswitch
switch.mod.dir = /usr/lib64/freeswitch

;switch xml handler
xml_handler.fs_path = false
xml_handler.reg_as_number_alias = false
xml_handler.number_as_presence_id = true

;error reporting options: user,dev,all
error.reporting = user

;websocket settings
; Alt Linux: port 8080 is occupied by Alterator, the system
; configuration tool. Use the port below instead of 8080.
websocket.host = 127.0.0.1
websocket.port = {WEBSOCKET_PORT}
